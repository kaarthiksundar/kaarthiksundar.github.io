<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting to the requested page...</p>
    <script>
        (function (location) {
            var pathSegmentsToKeep = 0;
            var repositoryRoot = location.pathname
                .split('/')
                .slice(0, 1 + pathSegmentsToKeep)
                .join('/');
            var route = location.pathname
                .slice(1)
                .split('/')
                .slice(pathSegmentsToKeep)
                .join('/')
                .replace(/\/+$/, '')
                .replace(/&/g, '~and~');
            var query = location.search
                ? '&' + location.search.slice(1).replace(/&/g, '~and~')
                : '';

            location.replace(
                location.protocol + '//' + location.hostname +
                (location.port ? ':' + location.port : '') +
                repositoryRoot + '/?/' + route + query + location.hash
            );
        })(window.location);
    </script>
    <noscript><p><a href="/">Return to the home page</a></p></noscript>
</body>
</html>
